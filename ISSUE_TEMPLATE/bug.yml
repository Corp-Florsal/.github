name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: sector
    attributes:
      label: Business sector
      options:
        - FlorSal Academy
        - FlorSal Tech
        - FlorSal Consulting
        - FlorSal Transport
        - FlorSal Leather
        - FlorSal Naturals
        - Organization governance
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Problem description
      description: Explain what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Go to...\n2. Click...\n3. Observe..."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system, browser, app version or device.
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed passwords, personal information and client data.
          required: true
